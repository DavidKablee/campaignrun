<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B1220" />
    <meta name="description" content="Drive your convoy through Nigeria. Load your people, dodge the go-slow, fill the rally." />
    <!-- Link previews (WhatsApp, X, Telegram). The image and URL must be absolute, so the build fills
         them from VITE_PUBLIC_URL; without it the page URL tag is dropped and the image stays relative. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Campaigner" />
    <meta property="og:title" content="Campaigner: drive your convoy through Nigeria" />
    <meta property="og:description" content="Load your people, dodge the go-slow, fill the rally. Beat my run on the same road." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Campaigner: a lane runner through Nigerian roads" />
    <meta property="og:url" content="%PUBLIC_URL%/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Campaigner: drive your convoy through Nigeria" />
    <meta name="twitter:description" content="Load your people, dodge the go-slow, fill the rally." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>Campaigner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
