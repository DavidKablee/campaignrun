<!doctype html>
<html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@600;700&display=swap');
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#0B1220;color:#F7F1E3;font-family:'DM Sans',sans-serif;position:relative;overflow:hidden}
.stripe{position:absolute;left:0;right:0;top:0;height:22px;background:repeating-linear-gradient(90deg,#F5C518 0 40px,#0B1220 40px 80px)}
.sky{position:absolute;inset:22px 0 0 0;background:linear-gradient(#1B2A4A,#0B1220 70%)}
.road{position:absolute;left:640px;right:0;bottom:0;height:330px;background:#151d2e;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
.road i{position:absolute;left:49.2%;width:1.6%;background:#F7F1E3;opacity:.85;border-radius:3px}
.card{position:absolute;left:64px;top:90px;width:680px}
.kicker{font-weight:700;letter-spacing:.22em;font-size:26px;color:#F5C518;text-transform:uppercase}
h1{font-family:'Archivo Black',sans-serif;font-size:128px;line-height:1;color:#F5C518;margin:14px 0 22px;text-shadow:0 8px 0 #7a5a00}
p{font-size:36px;line-height:1.25;font-weight:600;max-width:620px}
.pill{position:absolute;left:64px;bottom:46px;background:#F7F1E3;color:#0B1220;border-radius:999px;padding:14px 30px;font-weight:700;font-size:28px}
.fine{position:absolute;right:48px;bottom:26px;font-size:19px;opacity:.7;text-align:right;max-width:470px}
.van{position:absolute;right:90px;bottom:150px;width:300px;height:150px;background:#F5C518;border-radius:26px 26px 12px 12px;box-shadow:0 14px 0 #7a5a00}
.van:before{content:"";position:absolute;left:34px;right:34px;top:28px;height:52px;background:#0B1220;border-radius:10px}
.van b{position:absolute;left:0;right:0;bottom:40px;height:16px;background:repeating-linear-gradient(90deg,#0B1220 0 26px,transparent 26px 52px)}
.van u{position:absolute;bottom:-36px;width:62px;height:62px;border-radius:50%;background:#0B1220;border:10px solid #3a4560}
</style></head><body>
<div class="stripe"></div><div class="sky"></div><div class="road"><i style="top:6%;height:8%"></i><i style="top:30%;height:12%"></i><i style="top:60%;height:18%"></i></div>
<div class="van"><b></b><u style="left:36px"></u><u style="right:36px"></u></div>
<div class="card"><div class="kicker">A campaign convoy runner</div><h1>Campaigner</h1><p>Drive your convoy through Nigeria. Load your people, dodge the go&#8209;slow, fill the rally.</p></div>
<div class="pill">Beat my run on the same road</div>
</body></html>
